services:
  # Banco de dados MySQL
  mysql:
    image: mysql:8.0
    container_name: mautic_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mautic}
      MYSQL_USER: ${MYSQL_USER:-mautic}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mauticpassword}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    #ports:
     # - "3306:3306"
    networks:
      - mautic_network
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # Redis para cache e sessões
  redis:
    image: redis:7-alpine
    container_name: mautic_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    #ports:
     # - "6379:6379"
    networks:
      - mautic_network
    command: redis-server --appendonly yes

  # Aplicação Mautic
  mautic:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: mautic_app
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
    environment:
      # Configurações do banco de dados
      MAUTIC_DB_HOST: mysql
      MAUTIC_DB_PORT: 3306
      MAUTIC_DB_NAME: ${MYSQL_DATABASE:-mautic}
      MAUTIC_DB_USER: ${MYSQL_USER:-mautic}
      MAUTIC_DB_PASSWORD: ${MYSQL_PASSWORD:-mauticpassword}
      MAUTIC_DB_DRIVER: pdo_mysql
      MAUTIC_DB_SERVER_VERSION: 8.0
      
      # Configurações do Redis
      MAUTIC_CACHE_HOST: redis
      MAUTIC_CACHE_PORT: 6379
      
      # Configurações da aplicação
      MAUTIC_SECRET_KEY: ${MAUTIC_SECRET_KEY:-your-secret-key-here}
      MAUTIC_SITE_URL: ${MAUTIC_SITE_URL:-http://localhost}
      MAUTIC_LOCALE: ${MAUTIC_LOCALE:-en_US}
      MAUTIC_TIMEZONE: ${MAUTIC_TIMEZONE:-UTC}
      
      # Configurações de email
      MAUTIC_MAILER_DSN: ${MAUTIC_MAILER_DSN:-smtp://localhost:1025}
      
      # Configurações de mensageria
      MAUTIC_MESSENGER_DSN_EMAIL: ${MAUTIC_MESSENGER_DSN_EMAIL:-doctrine://default?queue_name=email}
      MAUTIC_MESSENGER_DSN_HIT: ${MAUTIC_MESSENGER_DSN_HIT:-doctrine://default?queue_name=hit}
      MAUTIC_MESSENGER_DSN_FAILED: ${MAUTIC_MESSENGER_DSN_FAILED:-doctrine://default?queue_name=failed}
      
      # Configurações de sessão
      MAUTIC_SESSION_NAME: ${MAUTIC_SESSION_NAME:-MAUTICSESSID}
      
      # Configurações de contexto de requisição
      MAUTIC_REQUEST_CONTEXT_HOST: ${MAUTIC_REQUEST_CONTEXT_HOST:-localhost}
      MAUTIC_REQUEST_CONTEXT_SCHEME: ${MAUTIC_REQUEST_CONTEXT_SCHEME:-http}
      MAUTIC_REQUEST_CONTEXT_BASE_URL: ${MAUTIC_REQUEST_CONTEXT_BASE_URL:-}
      MAUTIC_REQUEST_CONTEXT_HTTP_PORT: ${MAUTIC_REQUEST_CONTEXT_HTTP_PORT:-80}
      MAUTIC_REQUEST_CONTEXT_HTTPS_PORT: ${MAUTIC_REQUEST_CONTEXT_HTTPS_PORT:-443}
      
      # Configurações de migração
      MAUTIC_MIGRATIONS_TABLE_NAME: ${MAUTIC_MIGRATIONS_TABLE_NAME:-migrations}
      
      # Configurações do ElFinder
      MAUTIC_EL_FINDER_URL: ${MAUTIC_EL_FINDER_URL:-}
      MAUTIC_EL_FINDER_PATH: ${MAUTIC_EL_FINDER_PATH:-}
      
      # Ambiente
      APP_ENV: ${APP_ENV:-prod}
      APP_DEBUG: ${APP_DEBUG:-0}
      
    volumes:
      - mautic_data:/var/www/html/var
      - mautic_media:/var/www/html/media
      - mautic_logs:/var/www/html/var/logs
      - mautic_cache:/var/www/html/var/cache
      - mautic_tmp:/var/www/html/var/tmp
      - mautic_files:/var/www/html
    networks:
      - mautic_network
    healthcheck:
      test: ["CMD", "php", "-r", "echo 'PHP is running';"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx como proxy reverso
  nginx:
    image: nginx:alpine
    container_name: mautic_nginx
    restart: unless-stopped
    depends_on:
      - mautic
    # ports:
      #- "80:80"
      #- "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - mautic_data:/var/www/html/var:ro
      - mautic_media:/var/www/html/media:ro
      - mautic_files:/var/www/html:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl
    networks:
      - mautic_network
      - web

  # Worker para processamento de filas (opcional)
  mautic_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: mautic_worker
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
      - mautic
    environment:
      # Mesmas variáveis de ambiente do mautic
      MAUTIC_DB_HOST: mysql
      MAUTIC_DB_PORT: 3306
      MAUTIC_DB_NAME: ${MYSQL_DATABASE:-mautic}
      MAUTIC_DB_USER: ${MYSQL_USER:-mautic}
      MAUTIC_DB_PASSWORD: ${MYSQL_PASSWORD:-mauticpassword}
      MAUTIC_DB_DRIVER: pdo_mysql
      MAUTIC_DB_SERVER_VERSION: 8.0
      MAUTIC_CACHE_HOST: redis
      MAUTIC_CACHE_PORT: 6379
      MAUTIC_SECRET_KEY: ${MAUTIC_SECRET_KEY:-your-secret-key-here}
      MAUTIC_SITE_URL: ${MAUTIC_SITE_URL:-http://localhost}
      MAUTIC_LOCALE: ${MAUTIC_LOCALE:-en_US}
      MAUTIC_TIMEZONE: ${MAUTIC_TIMEZONE:-UTC}
      MAUTIC_MAILER_DSN: ${MAUTIC_MAILER_DSN:-smtp://localhost:1025}
      MAUTIC_MESSENGER_DSN_EMAIL: ${MAUTIC_MESSENGER_DSN_EMAIL:-doctrine://default?queue_name=email}
      MAUTIC_MESSENGER_DSN_HIT: ${MAUTIC_MESSENGER_DSN_HIT:-doctrine://default?queue_name=hit}
      MAUTIC_MESSENGER_DSN_FAILED: ${MAUTIC_MESSENGER_DSN_FAILED:-doctrine://default?queue_name=failed}
      MAUTIC_SESSION_NAME: ${MAUTIC_SESSION_NAME:-MAUTICSESSID}
      MAUTIC_REQUEST_CONTEXT_HOST: ${MAUTIC_REQUEST_CONTEXT_HOST:-localhost}
      MAUTIC_REQUEST_CONTEXT_SCHEME: ${MAUTIC_REQUEST_CONTEXT_SCHEME:-http}
      MAUTIC_REQUEST_CONTEXT_BASE_URL: ${MAUTIC_REQUEST_CONTEXT_BASE_URL:-}
      MAUTIC_REQUEST_CONTEXT_HTTP_PORT: ${MAUTIC_REQUEST_CONTEXT_HTTP_PORT:-80}
      MAUTIC_REQUEST_CONTEXT_HTTPS_PORT: ${MAUTIC_REQUEST_CONTEXT_HTTPS_PORT:-443}
      MAUTIC_MIGRATIONS_TABLE_NAME: ${MAUTIC_MIGRATIONS_TABLE_NAME:-migrations}
      MAUTIC_EL_FINDER_URL: ${MAUTIC_EL_FINDER_URL:-}
      MAUTIC_EL_FINDER_PATH: ${MAUTIC_EL_FINDER_PATH:-}
      APP_ENV: ${APP_ENV:-prod}
      APP_DEBUG: ${APP_DEBUG:-0}
    volumes:
      - mautic_data:/var/www/html/var
      - mautic_media:/var/www/html/media
      - mautic_logs:/var/www/html/var/logs
      - mautic_cache:/var/www/html/var/cache
      - mautic_tmp:/var/www/html/var/tmp
    networks:
      - mautic_network
    command: ["php", "bin/console", "messenger:consume", "email", "hit", "failed", "--time-limit=3600", "--memory-limit=512M"]
    profiles:
      - worker

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  mautic_data:
    driver: local
  mautic_media:
    driver: local
  mautic_logs:
    driver: local
  mautic_cache:
    driver: local
  mautic_tmp:
    driver: local
  mautic_files:
    driver: local

networks:
  mautic_network:
    driver: bridge
  web:
    external: true